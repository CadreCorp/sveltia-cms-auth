name: Claude Code Review

# Claude reviews every non-draft PR when it's opened, marked ready, reopened,
# and on every new push. Reviews post as the Claude GitHub App (claude[bot]).
# Setup (once, org-wide): install https://github.com/apps/claude on CadreCorp
# and add an org Actions secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# Based on https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they can't read the secret).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Review this pull request. The PR branch is already checked out in
            the current working directory. Read CLAUDE.md (and AGENTS.md) if
            the repo has one and hold the PR to its rules.

            Focus on what matters, most important first:
            - Bugs, data loss, and behavior that doesn't match the PR description
            - Security and privacy (auth, RLS, secrets, user data)
            - Migrations, schema and deploy risks; conflicts with other open PRs
            - Missing tests for risky logic
            Skip pure style nits unless they hide a bug. Verify claims against
            the code before making them; say "worth checking" when unsure.

            If EVENT is "synchronize", first read your earlier review comments
            on this PR (`gh pr view --comments`). Review only what the new
            commits changed, say which earlier points are now resolved, and
            don't repeat points that still stand. If nothing new is worth
            raising, post one short comment saying so.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines, and one
            `gh pr comment` for the summary. Only post GitHub comments; don't
            submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Glob,Grep"
